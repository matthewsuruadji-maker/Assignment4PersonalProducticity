[project]
name = "personal-productivity-mcp"
version = "0.1.0"
description = "A local MCP server for Gmail email retrieval, summarization, prioritization, and personal productivity."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.2.0",
    "python-dotenv>=1.2.3",
]


[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
